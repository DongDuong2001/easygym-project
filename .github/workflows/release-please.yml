# Keeps one "chore(main): release x.y.z" PR open with the next version and CHANGELOG.md, built from the conventional
# commits on main (feat → minor, fix → patch, "!" → major). Merging that PR tags vX.Y.Z and publishes the GitHub release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
